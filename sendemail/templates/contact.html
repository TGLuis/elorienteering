<!doctype html>
{% load static %}
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Contact ELOrienteering maintainers.">
    <title>Contact ELOrienteering</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
{% include "header.html" %}
<main>
    <div class="py-5 text-center">
        <h1>Contact me</h1>
        <div class="container text-start">
            <div class="order-md-2 mb-4">
                <p>If you have questions which are not answered in the about page, or if you have concerns about your data, you can email me with the following form.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form }}
                    <div class="form-actions text-center">
                        <button class="m-2 btn btn-primary" type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
{% include "footer.html" %}
</body>
</html>
