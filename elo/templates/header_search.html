<header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a href="/elo/" class="navbar-brand">
                {% load static %}
                <img src="{% static 'lost_coureur.png' %}" height="40px" alt="Coureur lost"/>
                <span class="fs-4">ELOrienteering</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myNavbar1" aria-controls="myNavbar1" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="myNavbar1">
                <ul class="nav nav-pills">
                    <li class="nav-item"><a href="/elo/" class="nav-link">Runners</a></li>
                    <li class="nav-item"><a href="/elo/about" class="nav-link">About</a></li>
                    <li class="nav-item">
                        <input type="text" id="searchInput" placeholder="Type runner name..." autocomplete="off" style="width:300px; padding:8px;" />
                        <div id="autocomplete-list"></div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
 <script>
    const searchInput = document.getElementById('searchInput');
    const autocompleteList = document.getElementById('autocomplete-list');

    function clearAutocomplete() {
        autocompleteList.innerHTML = '';
    }

    function createAutocompleteItem(runner) {
        var aUrl = document.createElement('a');
        const div = document.createElement('div');
        aUrl.setAttribute("href", runner.url);
        aUrl.appendChild(div);
        div.textContent = runner.name;
        return aUrl;
    }

    async function fetchAutocomplete() {
        const query = searchInput.value.trim();

        if (query.length === 0) {
            clearAutocomplete();
            return;
        }

        const url = new URL('/elo/api/runner/search', window.location.origin);
        url.searchParams.append('runner_pattern', query);

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network response was not ok');
            const runners = await response.json();

            clearAutocomplete();
            console.log(runners);

            if (runners.length === 0) {
                const noResult = document.createElement('div');
                noResult.textContent = 'No runner found';
                autocompleteList.appendChild(noResult);
                return;
            }

            runners.forEach(runner => {
                autocompleteList.appendChild(createAutocompleteItem(runner));
            });
        } catch (error) {
            console.error('Fetch error:', error);
        }
    }

    searchInput.addEventListener('input', fetchAutocomplete);

    // Close autocomplete list if clicked outside
    document.addEventListener('click', (e) => {
        if (e.target !== searchInput) {
            clearAutocomplete();
        }
    });
</script>
