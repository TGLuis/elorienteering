<!doctype html>
{% load static %}
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELOrienteering</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  {% include "header_search.html" %}
  <h1 class="m-4 text-center">ELO Ranking</h1>
  {% include "nav.html" %}
  <table class="m-2 table table-striped">
      <thead>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">ELO</th>
      </thead>
      <tbody>
        {% for runner in runners %}
        <tr>
            <td>{{ runner.place }}</td>
            <td><a href="/elo/{{ runner.properties.helga_id }}/">{{ runner.properties.fullname }}</a></td>
            <td>{{ runner.properties.elo }}</td>
        </tr>
        {% endfor %}
      </tbody>
  </table>
  {% include "nav.html" %}

  {% include "footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
